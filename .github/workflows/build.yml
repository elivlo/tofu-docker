name: build

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          versions=$(gh release list -R opentofu/opentofu -L 100 \
            --exclude-pre-releases --exclude-drafts --json tagName --jq '.[].tagName' \
            | sed 's/^v//' | sort -rV | awk -F. '!seen[$1"."$2]++' | head -3)
          matrix=$(jq -R -s -c 'split("\n")[:-1] | to_entries | map({version: .value, minor: (.value | split(".")[:2] | join(".")), latest: (.key == 0)})' <<< "$versions")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/opentofu
            ${{ secrets.DOCKERHUB_USERNAME }}/opentofu
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=${{ matrix.minor }}
            type=raw,value=latest,enable=${{ matrix.latest }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: TOFU_VERSION=${{ matrix.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          pull: true
          push: true

  description:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/opentofu
